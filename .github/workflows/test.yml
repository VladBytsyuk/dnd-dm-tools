name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout код
      uses: actions/checkout@v4
      
    - name: Настройка Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Установка зависимостей
      run: npm ci
      
    - name: Запуск линтера
      run: npm run svelte-check

    - name: Typecheck Obsidian plugin
      run: npx tsc --noEmit -skipLibCheck

    - name: Проверка Owlbear extension
      run: npm run owlbear:check
      
    - name: Запуск тестов
      run: npm test
      
    - name: Запуск тестов с покрытием
      run: npm run test:cov

    - name: Production build
      run: npm run build
      
    - name: Загрузка покрытия в Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/lcov.info
        fail_ci_if_error: false

  deploy-owlbear-extension:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://vladbytsyuk.github.io/dnd-dm-tools/owlbear-extension/

    steps:
    - name: Checkout код
      uses: actions/checkout@v4

    - name: Настройка Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Установка зависимостей
      run: npm ci

    - name: Проверка Owlbear extension
      run: npm run owlbear:check

    - name: Сборка GitHub Pages artifact
      run: npm run pages:build

    - name: Настройка GitHub Pages
      uses: actions/configure-pages@v5

    - name: Загрузка GitHub Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: .pages

    - name: Публикация GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
