<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>DnD DM Tools Owlbear Sync</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: Inter, system-ui, sans-serif;
				background: #171717;
				color: #f5f5f5;
			}

			body {
				margin: 0;
				padding: 12px;
				overflow: hidden;
			}

			main {
				display: flex;
				flex-direction: column;
				gap: 10px;
				height: calc(520px - 24px);
			}

			.initiative-panel {
				min-height: 0;
				display: flex;
				flex: 1;
				flex-direction: column;
				border: 1px solid #3f3f46;
				border-radius: 8px;
				overflow: hidden;
				background: #202023;
			}

			.initiative-heading {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 10px 12px;
				font-size: 13px;
				font-weight: 700;
				border-bottom: 1px solid #3f3f46;
			}

			.initiative-round {
				padding: 3px 7px;
				border-radius: 999px;
				background: #27272a;
				color: #c4b5fd;
				font-size: 12px;
			}

			.initiative-list {
				margin: 0;
				padding: 0;
				list-style: none;
				overflow-y: auto;
			}

			.initiative-empty {
				margin: auto;
				padding: 24px 12px;
				text-align: center;
				color: #a1a1aa;
				font-size: 13px;
			}

			.initiative-participant {
				--participant-color: #94a3b8;
				position: relative;
				display: grid;
				grid-template-columns: 52px minmax(0, 1fr);
				gap: 8px;
				min-height: 58px;
				padding: 5px 8px 5px 12px;
				border-top: 1px solid #3f3f46;
			}

			.initiative-participant:first-child { border-top: 0; }
			.initiative-participant::before {
				position: absolute;
				inset: 0 auto 0 0;
				width: 4px;
				content: "";
				background: var(--participant-color);
			}
			.initiative-participant[data-active="true"] { background: rgb(251 191 36 / 18%); box-shadow: inset 0 0 0 1px rgb(251 191 36 / 60%); }
			.initiative-participant[data-down="true"] { opacity: .62; }
			.initiative-participant[data-dead="true"] { opacity: .78; background: rgb(239 68 68 / 18%); }

			.initiative-portrait {
				display: grid;
				width: 52px;
				height: 52px;
				place-items: center;
				overflow: hidden;
				border: 1px solid #52525b;
				background: #18181b;
			}
			.initiative-portrait img { width: 100%; height: 100%; object-fit: cover; }
			.initiative-portrait-fallback { color: #e4e4e7; font-weight: 700; font-size: 15px; }
			.initiative-participant-content { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
			.initiative-name-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
			.initiative-name { overflow: hidden; color: #f4f4f5; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
			.initiative-score { margin-left: auto; min-width: 22px; color: #c4b5fd; text-align: center; font-size: 15px; font-weight: 700; }
			.initiative-statuses { display: flex; flex-wrap: wrap; gap: 4px; }
			.initiative-status { position: relative; display: grid; width: 18px; height: 18px; place-items: center; border: 1px solid #71717a; border-radius: 50%; background: #111827; }
			.initiative-status img { width: 13px; height: 13px; }
			.initiative-status-rounds { position: absolute; right: -6px; bottom: -6px; min-width: 11px; padding: 0 2px; border: 1px solid #eff6ff; border-radius: 999px; background: #2563eb; color: #fff; font-size: 9px; font-weight: 700; line-height: 12px; text-align: center; }

			.service-panel[hidden] { display: none; }

			.auth-row {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 36px;
				align-items: center;
				gap: 8px;
				min-height: 36px;
			}

			.auth-status {
				min-width: 0;
				padding: 0 4px;
				font-size: 13px;
				color: #d4d4d8;
			}

			.actions {
				display: grid;
				grid-template-columns: repeat(3, 36px);
				justify-content: start;
				gap: 8px;
			}

			input {
				box-sizing: border-box;
				width: 100%;
				border: 1px solid #3f3f46;
				border-radius: 8px;
				background: #202023;
				color: #f4f4f5;
				padding: 8px;
				font: 12px ui-monospace, monospace;
			}

			button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				border: 1px solid #3f3f46;
				border-radius: 8px;
				background: #27272a;
				color: #f4f4f5;
				padding: 0;
				cursor: pointer;
			}

			.icon-button {
				width: 36px;
				height: 36px;
				flex: 0 0 36px;
			}

			button.active {
				background: #2563eb;
				border-color: #3b82f6;
			}

			button svg {
				width: 18px;
				height: 18px;
				stroke: currentColor;
			}

			button:disabled {
				opacity: 0.55;
				cursor: not-allowed;
			}

			.status-panel {
				border: 1px solid #3f3f46;
				border-radius: 8px;
				background: #202023;
				overflow: hidden;
			}

			.status-panel[hidden] {
				display: none;
			}

			.status-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 6px 6px 4px 10px;
				font-size: 12px;
				font-weight: 600;
				color: #a1a1aa;
			}

			.status-header .icon-button {
				width: 30px;
				height: 30px;
				flex-basis: 30px;
				border-color: transparent;
				background: transparent;
			}

			.status {
				display: grid;
				gap: 6px;
				padding: 4px 10px 10px;
			}

			.row {
				display: flex;
				justify-content: space-between;
				gap: 12px;
				font-size: 13px;
			}

			.value {
				color: #a5b4fc;
				text-align: right;
			}

			.error {
				color: #fca5a5;
			}

			.row.error .value {
				color: #fca5a5;
			}
		</style>
	</head>
	<body>
		<main>
			<section id="initiative-panel" class="initiative-panel" aria-live="polite"></section>
			<section id="service-panel" class="service-panel" hidden>
			<div class="auth-row">
				<span id="auth-status" class="auth-status" aria-live="polite"></span>
				<input id="pairing-code" placeholder="Код сопряжения из Obsidian" autocomplete="off" hidden />
				<button id="edit-pairing" class="icon-button" type="button"></button>
			</div>
			<div class="actions">
				<button id="connect" class="icon-button" type="button"></button>
				<button id="reconnect" class="icon-button" type="button"></button>
				<button id="toggle-status" class="icon-button" type="button" aria-controls="status-panel"></button>
			</div>
			<section class="status-panel" id="status-panel" hidden>
				<header class="status-header">
					<span>Статус</span>
					<button id="copy-status" class="icon-button" type="button"></button>
				</header>
				<div class="status" id="status" aria-live="polite"></div>
			</section>
			</section>
		</main>
		<script type="module" src="./main.js"></script>
	</body>
</html>
