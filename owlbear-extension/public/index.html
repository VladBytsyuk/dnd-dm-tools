<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>DnD DM Tools Owlbear Sync</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: Inter, system-ui, sans-serif;
				background: #171717;
				color: #f5f5f5;
			}

			body {
				margin: 0;
				padding: 12px;
			}

			main {
				display: flex;
				flex-direction: column;
				gap: 10px;
			}

			.auth-row {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 36px;
				align-items: center;
				gap: 8px;
				min-height: 36px;
			}

			.auth-status {
				min-width: 0;
				padding: 0 4px;
				font-size: 13px;
				color: #d4d4d8;
			}

			.actions {
				display: grid;
				grid-template-columns: repeat(3, 36px);
				justify-content: start;
				gap: 8px;
			}

			input {
				box-sizing: border-box;
				width: 100%;
				border: 1px solid #3f3f46;
				border-radius: 8px;
				background: #202023;
				color: #f4f4f5;
				padding: 8px;
				font: 12px ui-monospace, monospace;
			}

			button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				border: 1px solid #3f3f46;
				border-radius: 8px;
				background: #27272a;
				color: #f4f4f5;
				padding: 0;
				cursor: pointer;
			}

			.icon-button {
				width: 36px;
				height: 36px;
				flex: 0 0 36px;
			}

			button.active {
				background: #2563eb;
				border-color: #3b82f6;
			}

			button svg {
				width: 18px;
				height: 18px;
				stroke: currentColor;
			}

			button:disabled {
				opacity: 0.55;
				cursor: not-allowed;
			}

			.status-panel {
				border: 1px solid #3f3f46;
				border-radius: 8px;
				background: #202023;
				overflow: hidden;
			}

			.status-panel[hidden] {
				display: none;
			}

			.status-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 6px 6px 4px 10px;
				font-size: 12px;
				font-weight: 600;
				color: #a1a1aa;
			}

			.status-header .icon-button {
				width: 30px;
				height: 30px;
				flex-basis: 30px;
				border-color: transparent;
				background: transparent;
			}

			.status {
				display: grid;
				gap: 6px;
				padding: 4px 10px 10px;
			}

			.row {
				display: flex;
				justify-content: space-between;
				gap: 12px;
				font-size: 13px;
			}

			.value {
				color: #a5b4fc;
				text-align: right;
			}

			.error {
				color: #fca5a5;
			}

			.row.error .value {
				color: #fca5a5;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="auth-row">
				<span id="auth-status" class="auth-status" aria-live="polite"></span>
				<input id="pairing-code" placeholder="Код сопряжения из Obsidian" autocomplete="off" hidden />
				<button id="edit-pairing" class="icon-button" type="button"></button>
			</div>
			<div class="actions">
				<button id="connect" class="icon-button" type="button"></button>
				<button id="reconnect" class="icon-button" type="button"></button>
				<button id="toggle-status" class="icon-button" type="button" aria-controls="status-panel"></button>
			</div>
			<section class="status-panel" id="status-panel" hidden>
				<header class="status-header">
					<span>Статус</span>
					<button id="copy-status" class="icon-button" type="button"></button>
				</header>
				<div class="status" id="status" aria-live="polite"></div>
			</section>
		</main>
		<script type="module" src="./main.js"></script>
	</body>
</html>
