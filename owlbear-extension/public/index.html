<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>DnD DM Tools Owlbear Sync</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: Inter, system-ui, sans-serif;
				background: #171717;
				color: #f5f5f5;
			}

			body {
				margin: 0;
				padding: 12px;
			}

			main {
				display: flex;
				flex-direction: column;
				gap: 10px;
			}

			.actions {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 8px;
			}

			textarea {
				box-sizing: border-box;
				width: 100%;
				min-height: 72px;
				resize: vertical;
				border: 1px solid #3f3f46;
				border-radius: 8px;
				background: #202023;
				color: #f4f4f5;
				padding: 8px;
				font: 12px ui-monospace, monospace;
			}

			button {
				border: 1px solid #3f3f46;
				border-radius: 8px;
				background: #27272a;
				color: #f4f4f5;
				padding: 8px 10px;
				cursor: pointer;
			}

			button.primary {
				background: #2563eb;
				border-color: #3b82f6;
			}

			button:disabled {
				opacity: 0.55;
				cursor: not-allowed;
			}

			.status {
				border: 1px solid #3f3f46;
				border-radius: 8px;
				padding: 10px;
				background: #202023;
				display: grid;
				gap: 6px;
			}

			.row {
				display: flex;
				justify-content: space-between;
				gap: 12px;
				font-size: 13px;
			}

			.value {
				color: #a5b4fc;
				text-align: right;
			}

			.error {
				color: #fca5a5;
			}
		</style>
	</head>
	<body>
		<main>
			<textarea id="snapshot" placeholder="Вставьте сюда JSON snapshot из Obsidian (Ctrl+V)"></textarea>
			<div class="actions">
				<button id="import">Импорт</button>
				<button id="push" class="primary">В сцену</button>
				<button id="reconnect">Связать</button>
				<button id="refresh">Статус</button>
			</div>
			<section class="status" id="status" aria-live="polite"></section>
		</main>
		<script type="module" src="./main.js"></script>
	</body>
</html>
